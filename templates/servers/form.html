{% extends "base.html" %}
{% block title %}{% if editing %}编辑服务器{% else %}新增服务器{% endif %} - NRM{% endblock %}
{% block content %}
<div class="panel panel-default" style="max-width:640px;">
    <div class="panel-heading">
        <h3 class="panel-title">{% if editing %}编辑服务器{% else %}新增服务器{% endif %}</h3>
    </div>
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <p class="text-muted"><a href="{% url 'credentials:create' %}">还没有凭据？去新建一个管理凭据</a></p>
            <button type="submit" name="action" value="save" class="btn btn-primary">保存</button>
            {% if editing %}
            <button type="submit" name="action" value="test" class="btn btn-success">保存并测试连接</button>
            <a href="{% url 'servers:detail' form.instance.pk %}" class="btn btn-default">取消</a>
            {% else %}
            <button type="submit" name="action" value="test" class="btn btn-success">保存并测试连接</button>
            <a href="{% url 'servers:list' %}" class="btn btn-default">取消</a>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
