{% extends "base.html" %}
{% block title %}GitCode 登录确认 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading"><h3 class="panel-title">GitCode 登录</h3></div>
            <div class="panel-body">
                {% if process == "connect" %}
                <p class="text-muted" style="margin-bottom:12px;">即将绑定您的 GitCode 账号，请确认继续。</p>
                {% else %}
                <p class="text-muted" style="margin-bottom:12px;">即将使用 GitCode 账号登录，请确认继续。</p>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                    {% endif %}
                    <button type="submit" class="btn btn-gitcode btn-block">继续使用 GitCode 登录</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
