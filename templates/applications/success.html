{% extends "base.html" %}
{% block title %}提交成功 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-8 col-sm-offset-2 col-md-6 col-md-offset-3">
        <div class="panel panel-default" style="text-align:center;">
            <div class="panel-body">
                <h2 style="color:#5cb85c;margin:16px 0 12px;">申请提交成功</h2>
                <p class="text-muted">您的申请《{{ application.title }}》已提交，等待管理员审批。</p>
                <p class="text-muted">提交时间：{{ application.created_at|date:"Y-m-d H:i" }}</p>
                <div style="margin:20px 0 16px;">
                    <a href="{% url 'applications:create' %}" class="btn btn-primary">再提交一份申请</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
