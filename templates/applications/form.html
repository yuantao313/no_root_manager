{% extends "base.html" %}
{% block title %}提交申请 - NRM{% endblock %}
{% block content %}
<div class="panel panel-default" style="max-width:640px;">
    <div class="panel-heading">
        <h3 class="panel-title">提交申请</h3>
    </div>
    <div class="panel-body">
        <p class="text-muted">填写申请信息后提交，管理员将尽快审批。</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">提交申请</button>
        </form>
    </div>
</div>
{% endblock %}
