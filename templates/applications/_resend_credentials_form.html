<form method="post" action="{% url 'applications:resend_mail' application.pk %}" style="margin-top:8px;" data-confirm="确定向 {{ application.email|default:'申请人邮箱' }} 重发开通邮件（含初始密码）吗？">
    {% csrf_token %}
    <button type="submit" class="{{ button_class }}">{{ button_label }}</button>
    {% if show_help %}<span class="text-muted" style="font-size:12px;">未收到邮件时，可重新发送开通凭据邮件。</span>{% endif %}
</form>
