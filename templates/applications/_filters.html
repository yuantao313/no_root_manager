<form method="get" class="form-inline">
    <div class="form-group">
        <select name="status" class="form-control">
            <option value="">全部状态</option>
            {% for value, label in status_choices %}
            <option value="{{ value }}"{% if f_status == value %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <select name="apply_type" class="form-control">
            <option value="">全部类型</option>
            {% for value, label in type_choices %}
            <option value="{{ value }}"{% if f_type == value %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    {% if show_server %}
    <div class="form-group">
        <select name="server" class="form-control">
            <option value="">全部服务器</option>
            {% for server in servers %}
            <option value="{{ server.pk }}"{% if f_server == server.pk|stringformat:"s" %} selected{% endif %}>{{ server.name }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary btn-sm">筛选</button>
    <a href="{% url reset_url %}" class="btn btn-default btn-sm">重置</a>
</form>
