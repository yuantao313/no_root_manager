{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}登录 - NRM{% endblock %}
{% block content %}
<style>
/* GitCode 品牌色按钮（从官网 favicon 提取主色 #FC5531） */
.btn-gitcode {
    color: #fff;
    background-color: #FC5531;
    border-color: #FC5531;
}
.btn-gitcode:hover,
.btn-gitcode:focus {
    color: #fff;
    background-color: #E0441F;
    border-color: #E0441F;
}
</style>
<div class="row">
    <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">登录</h3>
            </div>
            <div class="panel-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block">登录</button>
                </form>
                <hr>
                <a href="{% url 'accounts:gitcode_login' %}" class="btn btn-gitcode btn-block">使用 GitCode 登录</a>
                <p class="text-muted" style="font-size:13px;margin-top:12px;">还没有账号？<a href="{% url 'accounts:register' %}">去注册</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
