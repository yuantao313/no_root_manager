{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}登录 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-10 col-sm-offset-1 col-md-8 col-md-offset-2">
        <div class="panel panel-default nrm-form-panel">
            <div class="panel-heading">
                <h3 class="panel-title">登录</h3>
            </div>
            <div class="panel-body">
                <form method="post" class="nrm-form-grid">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="nrm-form-actions"><div><button type="submit" class="btn btn-primary">登录</button></div></div>
                </form>
                <hr>
                {% include "accounts/_gitcode_button.html" %}
                <p class="text-muted" style="font-size:13px;margin-top:12px;">还没有账号？<a href="{% url 'accounts:register' %}">去注册</a> · <a href="{% url 'accounts:password_reset' %}">忘记密码？</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
