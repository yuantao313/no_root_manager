{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}设置新密码 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading"><h3 class="panel-title">设置新密码</h3></div>
            <div class="panel-body">
                {% if validlink %}
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block">保存新密码</button>
                </form>
                {% else %}
                <p>链接无效或已过期，请重新<a href="{% url 'accounts:password_reset' %}">找回密码</a>。</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
