{% extends "base.html" %}
{% block title %}个人中心 - NRM{% endblock %}
{% block content %}
<div class="panel panel-default" style="max-width:640px;">
    <div class="panel-heading">
        <h3 class="panel-title">个人中心</h3>
    </div>
    <div class="panel-body">
        <dl>
            <dt>用户名</dt>
            <dd>{{ user.username }}</dd>
            <dt>邮箱</dt>
            <dd>{{ user.email|default:"—" }}</dd>
            <dt>角色</dt>
            <dd>{% if user.is_staff %}管理员{% else %}普通用户{% endif %}</dd>
            <dt>注册时间</dt>
            <dd>{{ user.date_joined|date:"Y-m-d H:i" }}</dd>
        </dl>
    </div>
</div>
{% endblock %}
