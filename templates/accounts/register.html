{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}注册 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h3 class="panel-title">注册账号</h3>
            </div>
            <div class="panel-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block">注册</button>
                </form>
                <hr>
                {% include "accounts/_gitcode_button.html" %}
                <p class="text-muted" style="font-size:13px;margin-top:12px;">已有账号？<a href="{% url 'accounts:login' %}">去登录</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
