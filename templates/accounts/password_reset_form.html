{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}找回密码 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading"><h3 class="panel-title">找回密码</h3></div>
            <div class="panel-body">
                <p class="text-muted" style="font-size:13px;">输入注册邮箱，我们将发送密码重置链接。</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block">发送重置链接</button>
                </form>
                <p class="text-muted" style="font-size:13px;margin-top:12px;"><a href="{% url 'accounts:login' %}">返回登录</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
