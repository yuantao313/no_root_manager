{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}设置本地密码 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-10 col-sm-offset-1 col-md-8 col-md-offset-2">
        <div class="panel panel-default nrm-form-panel">
            <div class="panel-heading"><h3 class="panel-title">设置本地密码</h3></div>
            <div class="panel-body">
                <form method="post" class="nrm-form-grid">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="nrm-form-actions"><div><button type="submit" class="btn btn-primary">设置密码</button></div></div>
                </form>
                <p class="text-muted" style="font-size:13px;margin-top:12px;"><a href="{% url 'accounts:profile' %}">返回个人中心</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
