{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}设置本地密码 - NRM{% endblock %}
{% block content %}
<div class="row">
    <div class="col-sm-6 col-sm-offset-3 col-md-4 col-md-offset-4">
        <div class="panel panel-default">
            <div class="panel-heading"><h3 class="panel-title">设置本地密码</h3></div>
            <div class="panel-body">
                <p class="text-muted" style="font-size:13px;">您当前仅通过 GitCode 登录。设置本地密码后，即使解绑 GitCode 也能正常登录系统。</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block">设置密码</button>
                </form>
                <p class="text-muted" style="font-size:13px;margin-top:12px;"><a href="{% url 'accounts:profile' %}">返回个人中心</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
