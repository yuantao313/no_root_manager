[project]
name = "no-root-manager"
version = "0.1.0"
description = "NRM (No Root Manager)：目标机器用户申请与接管管理系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crispy-bootstrap3>=2024.1",
    "cryptography>=50.0.0",
    "django>=6.1",
    "django-allauth>=65.19.0",
    "django-axes>=8.3.1",
    "django-crispy-forms>=2.7",
    "django-select2>=8.4.8",
    "django-widget-tweaks>=1.5.1",
    "paramiko>=5.0.0",
    "pypinyin>=0.55.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pre-commit",
    "pytest>=9.1.1",
    "pytest-django>=4.13.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv", "site", "migrations"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP"]
ignore = [
    "E501",   # 行宽由 formatter 处理
    "E203",   # 与 ruff format 冲突
]
